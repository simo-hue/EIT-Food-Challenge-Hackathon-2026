<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FridgeMate demo</title>
<meta name="description" content="FridgeMate demo app. Concept at prototype stage, simulated data.">
<meta name="theme-color" content="#F8F8EC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FridgeMate">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="preload" href="../assets/fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="stage">

  <aside class="aside">
    <a class="aside-mark" href="../">FridgeMate</a>
    <p class="aside-big">A portable camera for any fridge.</p>
    <p class="aside-oval">Demo, simulated data</p>
  </aside>

  <div class="phone" id="app">
    <header class="bar">
      <button class="logo" id="logo" data-action="camera" aria-label="FridgeMate">FridgeMate</button>
      <div class="bar-actions">
        <button class="ib" data-action="bell" aria-label="Notifications">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0112 0v5l1.500 2h-15z"/><path d="M10 20.500a2 2 0 004 0"/></svg>
          <span class="dot" id="bell-dot" hidden></span>
        </button>
        <button class="ib" data-action="settings" aria-label="Settings">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.500" cy="12" r="1.200"/><circle cx="12" cy="12" r="1.200"/><circle cx="18.500" cy="12" r="1.200"/></svg>
        </button>
      </div>
    </header>

    <div class="scroll" id="scroll">
      <main class="view" id="view"></main>
    </div>

    <nav class="tabs" aria-label="Sections">
      <button class="tab" data-action="tab" data-tab="fridge">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="3" width="12" height="18" rx="2"/><path d="M6 10h12M9.500 6v1.500M9.500 13v2.500"/></svg>
        <span>Fridge</span>
      </button>
      <button class="tab" data-action="tab" data-tab="cook">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11h14v6a3 3 0 01-3 3H8a3 3 0 01-3-3z"/><path d="M3 11h18M9.500 7.500c0-1.200 1-1.300 1-2.500M13.500 7.500c0-1.200 1-1.300 1-2.500"/></svg>
        <span>Cook</span>
      </button>
      <button class="tab" data-action="tab" data-tab="stats">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="13" width="4" height="7" rx=".5"/><rect x="10" y="8" width="4" height="12" rx=".5"/><rect x="16" y="4" width="4" height="16" rx=".5"/></svg>
        <span>Stats</span>
        <i class="dot" id="tab-stats-dot" hidden></i>
      </button>
      <button class="tab" data-action="tab" data-tab="shared">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.500 2.700-6 6-6s6 2.500 6 6"/><circle cx="17" cy="9.500" r="2.300"/><path d="M16.500 14.300c2.700 0 4.500 2 4.500 5.200"/></svg>
        <span>Shared</span>
      </button>
    </nav>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="scrim" id="scrim" hidden></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
      <button class="sheet-close ib" data-action="close" aria-label="Close">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div class="sheet-body" id="sheet-body"></div>
    </section>
  </div>

</div>
<noscript><p style="padding:24px">The demo needs JavaScript. <a href="../">Back to FridgeMate</a></p></noscript>
<script type="module" src="app.js"></script>
</body>
</html>
